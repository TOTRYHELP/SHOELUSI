<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROCK&ROLL CLEANING - CUSTOMER ENTRY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #141414;
      --border-color: #2a2a2a;
      --accent-white: #ffffff;
      --accent-gray: #888888;
      --accent-silver: #cccccc;
      --hover-glow: rgba(255, 255, 255, 0.15);
      --font-heading: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--accent-white);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.03) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 20%);
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #fff, #444, #fff);
    }

    .header {
      margin-bottom: 30px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 20px;
    }

    .header h1 {
      font-family: var(--font-heading);
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .header p {
      color: var(--accent-gray);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full-width {
      grid-column: span 2;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-silver);
    }

    input, select {
      background: #000;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px 15px;
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
      transition: all 0.2s ease;
      border-radius: 0;
    }

    input:focus, select:focus {
      border-color: var(--accent-white);
      box-shadow: 0 0 10px var(--hover-glow);
    }

    .file-upload-box {
      border: 1px dashed var(--border-color);
      background: #080808;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .file-upload-box:hover {
      border-color: var(--accent-white);
      background: #111;
    }

    .file-upload-box input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .preview-img {
      max-height: 120px;
      margin-top: 10px;
      display: none;
      border: 1px solid var(--accent-white);
      margin-left: auto;
      margin-right: auto;
    }

    .btn-submit {
      background: #fff;
      color: #000;
      border: none;
      padding: 16px;
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: #ccc;
      transform: translateY(-2px);
    }

    .btn-submit:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg {
      margin-top: 15px;
      padding: 12px;
      font-size: 13px;
      text-align: center;
      display: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-msg.success {
      background: #112614;
      border: 1px solid #28a745;
      color: #28a745;
    }

    .status-msg.error {
      background: #281111;
      border: 1px solid #dc3545;
      color: #dc3545;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .full-width {
        grid-column: span 1;
      }
      .container {
        padding: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Data Pelanggan</h1>
      <p>Customer Registration Form</p>
    </div>

    <form id="customerForm">
      <div class="form-grid">
        
        <div class="form-group">
          <label for="crew">Crew / Operator *</label>
          <select id="crew" required>
            <option value="">-- MEMUAT CREW --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tanggal">Tanggal *</label>
          <input type="date" id="tanggal" required>
        </div>

        <div class="form-group full-width">
          <label for="nama">Nama Pelanggan *</label>
          <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="form-group full-width">
          <label for="kontak">Nomor HP / Whatsapp *</label>
          <input type="tel" id="kontak" placeholder="08xxxxxxxxxx" required>
        </div>

        <div class="form-group">
          <label for="brand">Brand *</label>
          <input type="text" id="brand" placeholder="Nike, Adidas, Vans..." required>
        </div>

        <div class="form-group">
          <label for="type">Type / Model *</label>
          <input type="text" id="type" placeholder="Jordan 1, Old Skool..." required>
        </div>

        <div class="form-group full-width">
          <label for="size">Size *</label>
          <input type="text" id="size" placeholder="EUR 42 / 27cm" required>
        </div>

        <div class="form-group full-width">
          <label>Upload Foto Sepatu/Barang</label>
          <div class="file-upload-box">
            <span id="fileLabel">Klik / Drop Foto di Sini (PNG, JPG)</span>
            <input type="file" id="foto" accept="image/*">
            <img id="preview" class="preview-img" alt="Preview">
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit full-width">SIMPAN DATA</button>

      </div>
    </form>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT SETELAH DEPLOYMENT DILAKUKAN
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwLUZdBt_t7k74Md1vfHvmLXO4UBFmi07aIkkEJRsCCH5fX6ywk58BrmmFNNVxCygX/exec"; 

    let fotoBase64 = "";

    document.getElementById('tanggal').valueAsDate = new Date();

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(populateCrew).getOperatorList();
      } else {
        fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getOperators' })
        })
        .then(res => res.json())
        .then(res => { if(res.success) populateCrew(res.data); })
        .catch(err => console.error("Error fetching crew:", err));
      }
    });

    function populateCrew(crewList) {
      const select = document.getElementById('crew');
      select.innerHTML = '<option value="">-- PILIH CREW --</option>';
      crewList.forEach(crew => {
        const option = document.createElement('option');
        option.value = crew;
        option.textContent = crew;
        select.appendChild(option);
      });
    }

    document.getElementById('foto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          fotoBase64 = evt.target.result;
          const img = document.getElementById('preview');
          img.src = fotoBase64;
          img.style.display = 'block';
          document.getElementById('fileLabel').textContent = file.name;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('customerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSubmit');
      const status = document.getElementById('statusMsg');
      
      btn.disabled = true;
      btn.innerText = "PROSES SIMPAN...";
      status.style.display = 'none';

      const payload = {
        crew: document.getElementById('crew').value,
        tanggal: document.getElementById('tanggal').value,
        nama: document.getElementById('nama').value,
        kontak: document.getElementById('kontak').value,
        brand: document.getElementById('brand').value,
        type: document.getElementById('type').value,
        size: document.getElementById('size').value,
        fotoBase64: fotoBase64
      };

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onError)
          .saveCustomerData(payload);
      } else {
        fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveCustomer', payload: payload })
        })
        .then(res => res.json())
        .then(res => {
          if (res.success) onSuccess(res.data);
          else onError(res.error);
        })
        .catch(err => onError(err));
      }
    });

    function onSuccess(res) {
      const btn = document.getElementById('btnSubmit');
      const status = document.getElementById('statusMsg');
      
      btn.disabled = false;
      btn.innerText = "SIMPAN DATA";
      
      status.className = 'status-msg success';
      status.innerHTML = `DATA BERHASIL DISIMPAN!<br><b>ID: ${res.id}</b>`;
      status.style.display = 'block';

      document.getElementById('customerForm').reset();
      document.getElementById('tanggal').valueAsDate = new Date();
      document.getElementById('preview').style.display = 'none';
      document.getElementById('fileLabel').textContent = "Klik / Drop Foto di Sini (PNG, JPG)";
      fotoBase64 = "";
    }

    function onError(err) {
      const btn = document.getElementById('btnSubmit');
      const status = document.getElementById('statusMsg');
      
      btn.disabled = false;
      btn.innerText = "SIMPAN DATA";
      
      status.className = 'status-msg error';
      status.innerText = "GAGAL MENYIMPAN DATA: " + err;
      status.style.display = 'block';
    }
  </script>
</body>
</html>
